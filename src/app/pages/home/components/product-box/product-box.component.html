@if (product(); as p) {
  <mat-card appearance="outlined" class="card-hover h-full overflow-hidden" [class.sm:flex-row]="fullWidthMode()">
    <div class="img-well flex items-center justify-center p-4"
         [class.h-52]="!fullWidthMode()"
         [class.h-64]="fullWidthMode()"
         [class.sm:w-72]="fullWidthMode()"
         [class.sm:shrink-0]="fullWidthMode()">
      <img class="max-h-full max-w-full object-contain" [src]="p.imageUrl || 'https://placehold.co/300'" [alt]="p.title" loading="lazy" />
    </div>

    <div class="flex flex-col flex-1 gap-2 p-4">
      <span class="text-xs font-medium uppercase tracking-wider text-primary">{{ p.category | titlecase }}</span>
      <h3 class="font-medium leading-snug line-clamp-2" [title]="p.title">{{ p.title }}</h3>
      @if (fullWidthMode()) {
        <p class="text-muted text-sm line-clamp-3">{{ p.description }}</p>
      }

      <div class="flex items-center justify-between gap-3 mt-auto pt-3">
        <span class="text-xl font-semibold">{{ p.price | currency }}</span>
        <button mat-flat-button (click)="onAddToCart()" [attr.aria-label]="'Add ' + p.title + ' to cart'">
          <mat-icon>add_shopping_cart</mat-icon> Add
        </button>
      </div>
    </div>
  </mat-card>
}
